server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le service worker doit rester accessible a la racine, sans mise en cache agressive
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Toutes les routes cote client (React Router) retombent sur index.html
    location / {
        try_files $uri /index.html;
    }
}
