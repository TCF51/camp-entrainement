version: "3.9"

services:
  backend:
    build: ./backend
    container_name: camp-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      # Surcharge le DATABASE_URL de .env pour pointer vers le volume persistant
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      # Persiste la base SQLite en dehors du conteneur (survit aux redeploiements)
      - camp_db:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        # Remplace par l'URL publique de ton backend si tu deploies sur un serveur distant
        VITE_API_URL: http://localhost:4000/api
    container_name: camp-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  camp_db:
